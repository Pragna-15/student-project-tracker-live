<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Project Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <header>
      <h1>Student Project Tracker</h1>
      <p>Track our electronics project ideas.</p>
    </header>

    <main>

      <!-- ── Form section ─────────────────────────────────────── -->
      <section aria-labelledby="form-title">
        <h2 id="form-title">Add a Project</h2>

        <form id="project-form">

          <label for="name">Project name</label>
          <input
            id="name"
            type="text"
            name="name"
            required
            maxlength="80"
            placeholder="e.g. Solar-powered LED board"
          />

          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="Planned">Planned</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>

          <button id="save-button" type="submit">Add Project</button>
          <button id="cancel-button" type="button" hidden>Cancel</button>

        </form>

        <!-- Live region: JS writes feedback here; screen readers announce it -->
        <p id="message" role="status" aria-live="polite"></p>

      </section>

      <!-- ── List section ──────────────────────────────────────── -->
      <section aria-labelledby="list-title">
        <h2 id="list-title">Projects</h2>

        <p id="empty-state">No projects yet.</p>
        <ul id="project-list"></ul>

      </section>

    </main>

    <script src="script.js" defer></script>
  </body>
</html>
